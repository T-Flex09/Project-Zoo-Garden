  <body class="custom-bg" id="top">
    <div class="page-wrapper">
      <!-- Navbar -->
      <div id="navbar-placeholder"></div>

      <!-- Contact page -->
      <main>
        <div class="form-container">
        <span class="custom-span">Contactează-ne</span>
        <form target = "_blank" action="https://zenit-dev-build.netlify.app/.netlify/functions/contact" method="POST">
            <div class="form-group">
                <div class="form-row">
                    <div class="col">
                        <input type="text" name="name" class="form-control" placeholder="Numele complet" required>
                    </div>
                    <div class="col">
                        <input type="email" name="email" class="form-control" placeholder="Adresa de mail" required>
                    </div>
                    <div class="col">
                        <input type="text" name="subject" class="form-control" placeholder="Subiectul" required>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <textarea placeholder="Mesajul tău" class="form-control" name="message" rows="5" required></textarea>
            </div>
            <div class="form-group">
                <p>
                  <input type="checkbox" required> Sunt de acord ca Zenith să colecteze numele și adresa mea de e-mail.
                </p>
            </div>

            <!-- Google reCAPTCHA v2 checkbox -->
            <div class="g-recaptcha" data-sitekey="6LfrQKcrAAAAAJCmj6lYESrY1iYhzCE710MjLG5p"></div>
            <script src="https://www.google.com/recaptcha/api.js" async defer></script>

            <button id = 'trimite' type="submit" class="btn btn-lg btn-block form-button">Trimite mail</button>
        </form>

        </div>

        <!-- Contact info -->
        <div class="location-container">
          <span class="custom-span" style="margin-bottom: .3em;">Locație</span>
          <!-- Embed google maps -->
           <div class="google-maps-embed" style="width: 70%!important;">
            <div class="embed-map-responsive">
              <div class="embed-map-container">
                <iframe class="embed-map-frame" frameborder="0" scrolling="no" marginheight="0" marginwidth="0" src="https://maps.google.com/maps?width=600&height=400&hl=en&q=Colegiul%20National%20Grigore%20Moisil&t=&z=14&ie=UTF8&iwloc=B&output=embed">
                </iframe>
              </div>
            </div>
          </div>
        </div>
      </main>

      <!-- Footer -->
      <div id="footer-placeholder"></div>
      
      <!-- Back to top btn -->
      <div id="progress">
        <span id="progress-value">&#8593;</span>
      </div>
    </div>
